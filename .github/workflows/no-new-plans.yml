name: No new plans

# Fails the caller's CI when a file under docs/plans/ is not on the caller's `.plans-list`, or the list
# gained a line. All of the logic is no-new-plans/no-new-plans.mjs.

on:
  workflow_call:

jobs:
  no-new-plans:
    name: no new plans
    # ubuntu-slim, since the job is thin; workflow-policy/slim-jobs.test.mjs holds it to slim's limits.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: repo
          # The whole history: the check reads the base's list, however far back a pull request's
          # base or a push's previous tip is.
          fetch-depth: 0
          persist-credentials: false

      # The check from the commit this workflow file was called at, as pointer-check.yml takes its checker.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: filiptrivan/ci-workflows
          ref: ${{ job.workflow_sha }}
          path: checker
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: checker/.nvmrc

      - name: Judge every plan, and the list against the base
        working-directory: repo
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push names an all-zero previous tip, and a force push one that is no
          # longer in history: the run then judges every plan but counts no line as added, which the
          # branch's pull request judges against its base.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node ../checker/no-new-plans/no-new-plans.mjs --base "$BASE"
          else
            echo "::notice::no base commit to compare the list with; the pull request's run judges its added lines"
            node ../checker/no-new-plans/no-new-plans.mjs
          fi
