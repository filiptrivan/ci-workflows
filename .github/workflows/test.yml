name: Test

# The pointer check's own tests; the reusable workflows here run in their callers, not here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pointer-check:
    name: pointer check tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: node --test pointer-check/pointer-check.test.mjs
